# 管理后台：/api/admin 与 Vue3 静态资源。建议只在内网/VPN 暴露。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payops-admin
  labels:
    app.kubernetes.io/name: payops-admin
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: payops-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payops-admin
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payops-admin
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payops
          image: payops
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PayOps__Roles
              value: Admin
          envFrom:
            - configMapRef:
                name: payops-config
            - secretRef:
                name: payops-secret
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "8"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payops-admin
  labels:
    app.kubernetes.io/name: payops-admin
spec:
  selector:
    app.kubernetes.io/name: payops-admin
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payops-admin
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payops-admin
