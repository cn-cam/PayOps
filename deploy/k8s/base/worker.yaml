# 后台任务：通知派发与投递、掉单补偿、超时关单、退款巡检。
# 任务领取基于数据库 SKIP LOCKED + 租约，消息消费为 RabbitMQ 竞争消费，副本之间无需选主，可直接水平扩容。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payops-worker
  labels:
    app.kubernetes.io/name: payops-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: payops-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payops-worker
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payops-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payops
          image: payops
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PayOps__Roles
              value: Worker
          envFrom:
            - configMapRef:
                name: payops-config
            - secretRef:
                name: payops-secret
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payops-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payops-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payops-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payops-worker
