# 仅用于演示的单实例中间件。生产请使用云托管或 Operator 部署的高可用实例。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payops-mysql
spec:
  serviceName: payops-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payops-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payops-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: demo-mysql-pass
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: payops-mysql
spec:
  selector:
    app.kubernetes.io/name: payops-mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payops-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payops-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payops-redis
    spec:
      containers:
        - name: redis
          image: redis:8
          args: ["redis-server", "--requirepass", "demo-redis-pass"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payops-redis
spec:
  selector:
    app.kubernetes.io/name: payops-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payops-rabbitmq
spec:
  serviceName: payops-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payops-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payops-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: payops
            - name: RABBITMQ_DEFAULT_PASS
              value: demo-rabbit-pass
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: payops-rabbitmq
spec:
  selector:
    app.kubernetes.io/name: payops-rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
