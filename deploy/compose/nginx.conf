# PayOps 入口网关：把流量均衡到多个 api 副本。
# 使用 Docker 内置 DNS（127.0.0.11）动态解析 api 服务名，副本扩缩后无需重启 Nginx。

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    # 某个副本不可用时自动换下一个副本重试（仅限连接失败/超时，避免重复提交非幂等请求）
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    server {
        listen 80;

        set $payops_api http://api:8080;

        location /nginx-health {
            access_log off;
            return 200 "ok";
        }

        location / {
            proxy_pass $payops_api;
        }
    }
}
